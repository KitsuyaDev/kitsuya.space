
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~ kitsuya.space ~</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inconsolata:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              pixel: ['"Press Start 2P"', 'cursive'],
              retro: ['"VT323"', 'monospace'],
              mono: ['"Inconsolata"', 'monospace'],
            },
            colors: {
                sakura: {
                    200: '#ffd1dc',
                    300: '#ffb7c5',
                    400: '#ff8da1',
                    500: '#ff6b8b',
                }
            }
          }
        }
      }
    </script>
    <style>
        :root {
            --bg-color: #050204;
            --text-color: #fff0f3;
            --sakura-main: #ffb7c5;
            --border-color: rgba(255, 183, 197, 0.12);
            --panel-bg: rgba(8, 3, 6, 0.88);
            --glow-color: rgba(255, 183, 197, 0.1);
            --panel-glow: 0 0 30px rgba(255, 183, 197, 0.03);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inconsolata', monospace;
            image-rendering: auto;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            margin: 0;
        }

        /* Captivating Background Stack */
        .bg-system {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0d060a 0%, #050204 100%);
        }

        .nebula-core {
            position: absolute;
            inset: -30%;
            filter: blur(140px) contrast(1.1);
            opacity: 0.15;
            mix-blend-mode: screen;
        }

        .nebula-blob {
            position: absolute;
            border-radius: 50%;
            animation: nebula-float 50s infinite alternate ease-in-out;
        }

        @keyframes nebula-float {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(8%, 12%) scale(1.15) rotate(15deg); }
            100% { transform: translate(-10%, 5%) scale(0.9) rotate(-10deg); }
        }

        /* Sakura Canvas */
        #sakura-canvas {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.5;
        }

        .grid-layer {
            position: fixed;
            inset: -30%;
            background-image: 
                linear-gradient(var(--border-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 100px 100px;
            z-index: -1;
            opacity: 0.12;
            mask-image: radial-gradient(circle at center, black, transparent 95%);
            transition: transform 0.5s ease-out;
        }

        /* CRT Scanline Effect */
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.03) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.2;
        }

        .dimden-panel {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            position: relative;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.6), var(--panel-glow);
            border-radius: 0;
        }

        /* Static Texture Noise */
        .dimden-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 1;
            border-radius: inherit;
        }

        @media (min-width: 768px) {
            .dimden-panel:hover {
                border-color: var(--sakura-main);
                box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 183, 197, 0.15);
                transform: translate(-2px, -2px);
            }
        }

        #mouse-glow {
            position: fixed;
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.3;
            transform: translate(-50%, -50%);
        }

        .stars-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -2;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 0;
            opacity: 0;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.6); }
            50% { opacity: var(--max-opacity); transform: scale(1.1); }
        }

        .text-shadow-hard {
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.8);
        }

        /* Ultrakill Overrides (applies when parent has .ultrakill-theme) */
        body:has(.ultrakill-theme) {
            --bg-color: #050000;
            --sakura-main: #ef4444;
            --border-color: rgba(239, 68, 68, 0.3);
            --panel-bg: rgba(10, 0, 0, 0.9);
            --glow-color: rgba(239, 68, 68, 0.1);
        }
        
        .pixelated { image-rendering: pixelated; }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div class="scanlines"></div>
    <div class="bg-system">
        <div class="nebula-core">
            <div class="nebula-blob" style="width: 90vw; height: 90vw; background: #ffb7c5; top: -15%; left: -10%;"></div>
            <div class="nebula-blob" style="width: 80vw; height: 80vw; background: #7c3aed; bottom: -15%; right: -10%; animation-delay: -8s;"></div>
            <div class="nebula-blob" style="width: 70vw; height: 70vw; background: #3b82f6; top: 30%; left: 30%; animation-delay: -20s;"></div>
            <div class="nebula-blob" style="width: 60vw; height: 60vw; background: #ec4899; bottom: 20%; left: 10%; animation-delay: -35s; opacity: 0.5;"></div>
        </div>
    </div>
    
    <canvas id="sakura-canvas"></canvas>
    <div class="stars-container" id="stars-field"></div>
    <div class="grid-layer" id="grid"></div>
    <div id="mouse-glow"></div>
    
    <div id="root"></div>

    <script>
        const canvas = document.getElementById('sakura-canvas');
        const ctx = canvas.getContext('2d');
        const glow = document.getElementById('mouse-glow');
        const grid = document.getElementById('grid');
        const starsField = document.getElementById('stars-field');

        let width, height, petals = [];

        const isUltrakill = () => document.body.querySelector('.ultrakill-theme') !== null;

        const initCanvas = () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            petals = [];
            for (let i = 0; i < 50; i++) {
                petals.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 4 + 2,
                    s: Math.random() * 1.2 + 0.3,
                    w: Math.random() * Math.PI,
                    v: Math.random() * 0.02,
                    colorIdx: i % 3
                });
            }
        };

        const drawSakura = () => {
            ctx.clearRect(0, 0, width, height);
            const ukMode = isUltrakill();
            
            petals.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.w);
                
                let color = p.colorIdx === 0 ? '#ffb7c5' : (p.colorIdx === 1 ? '#fff0f3' : '#ffd1dc');
                if(ukMode) {
                    color = p.colorIdx === 0 ? '#ef4444' : (p.colorIdx === 1 ? '#b91c1c' : '#7f1d1d');
                }
                
                ctx.fillStyle = color;
                ctx.globalAlpha = 0.6;
                ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r); // Minecraft blocky petal shape
                ctx.restore();
                
                p.y += p.s * (ukMode ? 2.5 : 1);
                p.x += Math.sin(p.w) * (ukMode ? 1.5 : 0.8);
                p.w += p.v;
                
                if (p.y > height + 20) {
                    p.y = -20;
                    p.x = Math.random() * width;
                }
            });
            requestAnimationFrame(drawSakura);
        };

        const initStars = () => {
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.floor(Math.random() * 3 + 1);
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                star.style.backgroundColor = i % 8 === 0 ? '#ffb7c5' : '#ffffff';
                star.style.setProperty('--duration', (Math.random() * 5 + 3) + 's');
                star.style.setProperty('--max-opacity', (Math.random() * 0.6 + 0.1));
                star.style.animationDelay = (Math.random() * 15) + 's';
                starsField.appendChild(star);
            }
        };

        window.addEventListener('resize', initCanvas);
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX / window.innerWidth - 0.5);
            const moveY = (e.clientY / window.innerHeight - 0.5);
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
            grid.style.transform = `translate(${moveX * 45}px, ${moveY * 45}px)`;
            starsField.style.transform = `translate(${moveX * -25}px, ${moveY * -25}px)`;
        });

        initCanvas();
        initStars();
        drawSakura();
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
