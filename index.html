
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~ kitsuya.space ~</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inconsolata:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050204;
            --text-color: #fff0f3;
            --sakura-main: #ffb7c5;
            --border-color: rgba(255, 183, 197, 0.12);
            --panel-bg: rgba(10, 4, 7, 0.82);
            --glow-color: rgba(255, 183, 197, 0.2);
            --panel-glow: 0 0 25px rgba(255, 183, 197, 0.08);
            --cherry-glow: #ff4d7a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inconsolata', monospace;
            image-rendering: pixelated;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            margin: 0;
        }

        .nebula {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            overflow: hidden;
        }
        
        .glow-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(180px);
            opacity: 0.12;
            mix-blend-mode: screen;
            animation: drift 50s infinite alternate ease-in-out;
            transition: all 2s ease;
        }

        @keyframes drift {
            0% { transform: translate(-20%, -10%) scale(1); }
            33% { transform: translate(10%, 15%) scale(1.1); }
            66% { transform: translate(15%, -15%) scale(0.95); }
            100% { transform: translate(-5%, 5%) scale(1.05); }
        }

        .grid-layer {
            position: fixed;
            inset: -30%;
            background-image: 
                linear-gradient(var(--border-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 120px 120px;
            z-index: -1;
            opacity: 0.25;
            mask-image: radial-gradient(circle at center, black, transparent 95%);
            transition: transform 1.2s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .dimden-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px) saturate(130%);
            -webkit-backdrop-filter: blur(20px) saturate(130%);
            position: relative;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.4),
                var(--panel-glow);
            border-radius: 8px;
        }

        /* Ambient subtle noise instead of glint/shine */
        .dimden-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 1;
            border-radius: inherit;
        }
        
        @media (min-width: 768px) {
            .dimden-panel:hover {
                border-color: rgba(255, 183, 197, 0.35);
                box-shadow: 0 0 45px rgba(255, 183, 197, 0.15);
                transform: translateY(-4px);
            }
        }
        
        .pixel-title {
            font-family: 'Press Start 2P', cursive;
            color: var(--sakura-main);
            text-shadow: 0 0 12px rgba(255, 183, 197, 0.4);
            letter-spacing: -0.02em;
        }

        #mouse-glow {
            position: fixed;
            width: 900px;
            height: 900px;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.4;
            transform: translate(-50%, -50%);
        }

        .terminal-font {
            font-family: 'VT323', monospace;
            letter-spacing: 0.02em;
        }

        .stars-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            perspective: 1000px;
        }
        
        /* Layered stars for parallax */
        .stars-layer {
            position: absolute;
            inset: -50%;
            width: 200%;
            height: 200%;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--duration) infinite ease-in-out;
            box-shadow: 0 0 6px white;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.4); }
            50% { opacity: var(--max-opacity); transform: scale(1.15); }
        }

        /* Elegant Shooting Star */
        .shooting-star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: linear-gradient(90deg, white, transparent);
            border-radius: 50%;
            box-shadow: 0 0 15px 3px white;
            animation: shoot var(--duration) linear infinite;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes shoot {
            0% { transform: translate(-100px, -100px) rotate(40deg) scaleX(1); opacity: 0; }
            5% { opacity: 1; }
            20% { transform: translate(600px, 500px) rotate(40deg) scaleX(20); opacity: 0; }
            100% { transform: translate(600px, 500px) rotate(40deg) scaleX(20); opacity: 0; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body id="body-tag">
    <div class="stars-container" id="stars-master">
        <div class="stars-layer" id="stars-deep"></div>
        <div class="stars-layer" id="stars-mid"></div>
        <div class="stars-layer" id="stars-front"></div>
    </div>
    <div class="nebula" id="nebula">
        <div class="glow-blob" id="blob-1" style="width: 80vw; height: 80vw; background: radial-gradient(circle, #ffb7c5 0%, transparent 80%); top: -15%; left: -10%;"></div>
        <div class="glow-blob" id="blob-2" style="width: 70vw; height: 70vw; background: radial-gradient(circle, #7c3aed 0%, transparent 80%); bottom: -15%; right: -10%; animation-delay: -10s;"></div>
        <div class="glow-blob" id="blob-3" style="width: 60vw; height: 60vw; background: radial-gradient(circle, #2563eb 0%, transparent 80%); top: 40%; left: 50%; animation-delay: -20s; opacity: 0.08;"></div>
        <div class="glow-blob" id="blob-4" style="width: 50vw; height: 50vw; background: radial-gradient(circle, #ec4899 0%, transparent 80%); top: 10%; right: 20%; animation-delay: -30s; opacity: 0.05;"></div>
    </div>
    <div class="grid-layer" id="grid"></div>
    <div id="mouse-glow"></div>
    
    <div id="root"></div>

    <script>
        const glow = document.getElementById('mouse-glow');
        const grid = document.getElementById('grid');
        const starsDeep = document.getElementById('stars-deep');
        const starsMid = document.getElementById('stars-mid');
        const starsFront = document.getElementById('stars-front');

        const starColors = ['#ffffff', '#ffb7c5', '#e9d5ff', '#fff7ed', '#bae6fd', '#fde68a'];

        const createLayer = (container, count, parallaxFactor) => {
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = (Math.random() * 1.5 + 0.5) * parallaxFactor;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                star.style.backgroundColor = starColors[Math.floor(Math.random() * starColors.length)];
                star.style.setProperty('--duration', (Math.random() * 6 + 4) + 's');
                star.style.setProperty('--max-opacity', (Math.random() * 0.7 + 0.1));
                star.style.animationDelay = (Math.random() * 12) + 's';
                container.appendChild(star);
            }
        };

        const createShooters = () => {
            for (let i = 0; i < 4; i++) {
                const shooter = document.createElement('div');
                shooter.className = 'shooting-star';
                shooter.style.top = Math.random() * 60 + '%';
                shooter.style.left = Math.random() * 100 + '%';
                shooter.style.setProperty('--duration', (Math.random() * 8 + 8) + 's');
                shooter.style.animationDelay = (Math.random() * 25) + 's';
                document.getElementById('stars-master').appendChild(shooter);
            }
        };

        createLayer(starsDeep, 80, 0.5);
        createLayer(starsMid, 60, 1.0);
        createLayer(starsFront, 40, 1.5);
        createShooters();

        document.addEventListener('mousemove', (e) => {
            requestAnimationFrame(() => {
                const moveX = (e.clientX / window.innerWidth - 0.5);
                const moveY = (e.clientY / window.innerHeight - 0.5);
                
                glow.style.left = e.clientX + 'px';
                glow.style.top = e.clientY + 'px';
                
                grid.style.transform = `translate(${moveX * 40}px, ${moveY * 40}px)`;
                
                // Multilayer parallax
                starsDeep.style.transform = `translate(${moveX * -8}px, ${moveY * -8}px)`;
                starsMid.style.transform = `translate(${moveX * -20}px, ${moveY * -20}px)`;
                starsFront.style.transform = `translate(${moveX * -45}px, ${moveY * -45}px)`;
            });
        });
    </script>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
